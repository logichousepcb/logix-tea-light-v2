[env:esp32c3-supermini]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.embed_files = data/logo.jpg

; The C3 Super Mini has no USB-UART bridge; route Serial over native USB.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    adafruit/Adafruit NeoPixel @ ^1.12.0

; For wireless updates after the first USB flash:
;   pio run -t upload --upload-port <device-name>.local
; and add:  upload_protocol = espota
;           upload_flags = --auth=<OTA_PASSWORD>
